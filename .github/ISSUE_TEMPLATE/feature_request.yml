name: 功能建议
description: 提一个新功能或改进方向
title: "[需求] "
labels: ["enhancement"]
body:
  - type: textarea
    id: pain
    attributes:
      label: 想解决什么痛点
      description: 描述你遇到的具体问题或不便（而不是直接说"建议加 XX 功能"）
      placeholder: 我在管理 200+ 技能时，经常……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的用法
      description: 你希望怎么用？越具体越好
      placeholder: 比如在技能列表里能……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
      placeholder: 目前我是这样绕过的……

  - type: checkboxes
    id: willing
    attributes:
      label: 你愿意自己动手实现吗
      options:
        - label: 我愿意提 PR（先在评论区讨论方案）
